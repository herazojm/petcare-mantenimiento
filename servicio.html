<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del servicio · PetCare</title>
  <meta name="description" content="Precio, duración, qué incluye y profesionales de cada servicio PetCare. Agenda tu cita en línea.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F766E">
  <script>/* HU-01: aplica el tema guardado antes de pintar */try{var t=localStorage.getItem('petcare:tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro');document.documentElement.setAttribute('data-tema',t)}catch(e){}</script>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/illustrations.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/pages/detail.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <pc-header active="servicios"></pc-header>

  <main id="contenido">
    <div class="container" style="padding-top:28px">
      <nav class="breadcrumb" aria-label="Migas de pan">
        <ol><li><a href="index.html">Inicio</a></li><li><a href="servicios.html">Servicios</a></li><li aria-current="page" id="miga">Servicio</li></ol>
      </nav>

      <!-- Galería + información para decidir (D3) -->
      <div class="detail">
        <div class="gallery">
          <div class="gallery__main" id="foto"></div>
          <div class="gallery__thumbs" id="miniaturas" aria-label="Más imágenes"></div>
        </div>

        <div class="detail__info">
          <span><span class="tag" id="categoria"></span></span>
          <h1 id="nombre"></h1>
          <p class="rating" id="rating"></p>
          <div class="price-row">
            <span class="price-big" id="precio" aria-live="polite"></span>
            <span class="tag tag--outline" id="duracion"></span>
          </div>
          <p class="muted" id="descripcion"></p>
          <div>
            <h2 class="h-small" style="font-family:var(--f-texto);font-size:1rem;font-weight:700;margin-bottom:6px">Incluye</h2>
            <ul class="includes" id="incluye"></ul>
          </div>
          <fieldset style="border:0;padding:0;margin:0">
            <legend style="font-weight:700;margin-bottom:8px">Tamaño de tu mascota</legend>
            <div class="segmented" id="tamanos"></div>
          </fieldset>
          <p class="hint" id="sedes"></p>
          <div class="detail__ctas">
            <a class="btn btn--block" id="agendar" href="agendar.html">Agendar este servicio</a>
            <button class="btn btn--secundario btn--block" type="button" id="whatsapp"><i data-icon="message-circle"></i>Escribir por WhatsApp</button>
          </div>
          <p class="hint"><i data-icon="shield-check" style="display:inline"></i> Cancelación gratis hasta 24 h antes de la cita. Pagas en la sede.</p>
        </div>
      </div>
    </div>

    <section class="section section--alt mt-40" aria-labelledby="pros-title">
      <div class="container">
        <h2 id="pros-title" style="margin-bottom:24px">Nuestros profesionales</h2>
        <div class="grid grid--3 pros" id="profesionales"></div>
      </div>
    </section>

    <section class="section" id="preguntas" aria-labelledby="faq-title">
      <div class="container">
        <h2 id="faq-title" style="margin-bottom:24px">Preguntas frecuentes</h2>
        <div class="accordion" id="faq"></div>
      </div>
    </section>

    <section class="section section--alt" aria-labelledby="rel-title">
      <div class="container">
        <h2 id="rel-title" style="margin-bottom:24px">También te puede interesar</h2>
        <div class="grid grid--3" id="relacionados"></div>
      </div>
    </section>
  </main>

  <pc-footer></pc-footer>
</body>
</html>
